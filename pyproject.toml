[tool.poetry]
name = "people-search-enrichment"
version = "1.0.0"
description = "People Search + Contact Enrichment with FullEnrich API v2"
authors = ["Hrytos Team"]
readme = "README.md"
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
# HTTP & API
requests = "^2.31.0"
httpx = "^0.27.0"
tenacity = "^8.2.3"

# Database
supabase = "^2.3.4"

# Web Framework
streamlit = "^1.31.0"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}

# Data Processing
pandas = "^2.2.0"

# Configuration
python-dotenv = "^1.0.0"

# Tunneling (optional)
pyngrok = "^7.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^4.1.0"
black = "^24.1.0"
ruff = "^0.2.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
